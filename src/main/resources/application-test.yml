# Automated tests. The datasource is supplied by the test support (TestDatabase):
# TEST_DATABASE_URL / TEST_DATABASE_USER / TEST_DATABASE_PASSWORD when set, otherwise a
# Testcontainers postgres:16 container.
spring:
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
  thymeleaf:
    cache: false

server:
  port: 0
  servlet:
    session:
      cookie:
        name: LS_SESSION
        secure: false

logging:
  level:
    it.logisticasanchez: DEBUG

ls:
  security:
    ip-hash-key: test-only-ip-hash-key-not-a-secret
  notifications:
    sink: memory
    worker:
      enabled: false
    token-encryption-key: dGVzdC1vbmx5LXRva2VuLWtleS1ub3Qtc2VjcmV0LTA=
  retention:
    enabled: false
