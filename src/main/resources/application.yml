# Logistica Sanchez web app - base configuration for every profile.
# Everything environment-specific comes from the environment (no secret defaults):
#   DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD   JDBC connection of the app
#   SERVER_PORT                                        HTTP port (default 8080)
#   LS_*                                               application settings (platform module)
# Profiles: local (developer machine), test (automated tests), staging, prod.
spring:
  application:
    name: ls-web
  main:
    banner-mode: "off"
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${LS_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    clean-disabled: true
  thymeleaf:
    cache: true
  web:
    locale: it
    locale-resolver: fixed
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Forwarded headers are handled by the platform's ForwardedHeadersFilter (one trusted hop,
  # ls.security.proxy.trust-forwarded-headers), never by the container.
  forward-headers-strategy: none
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
  servlet:
    session:
      cookie:
        # __Host- prefix: Secure, Path=/, no Domain (chapter 10 §2). The local and test
        # profiles use a plain name because browsers refuse __Host- cookies over http://.
        name: __Host-LS_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

# Observability (NFR-04): /actuator/health is the only management endpoint, without details.
# Every other endpoint is disabled (access none) and not exposed.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false
  info:
    env:
      enabled: false
    build:
      enabled: false

logging:
  level:
    root: INFO
    it.logisticasanchez: INFO

# Application settings (platform module, ADR 0027 and plan §8): every ls.* key has a typed
# default in it.logisticasanchez.web.platform.config; profiles and the environment override.
ls:
  security:
    ip-hash-key: ${LS_SECURITY_IP_HASH_KEY:}
  notifications:
    token-encryption-key: ${LS_TOKEN_ENCRYPTION_KEY:}
