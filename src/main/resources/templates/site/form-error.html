<!DOCTYPE html>
<!--
  Native-mode failure of POST /api/form (chapter 06 §5.6, ADR 0014): the «Invio non riuscito» page of
  form.mjs:234-241 with the public layout. Variables: message (the Italian reason), back (the form's page),
  retryAfter (seconds, 429 only). The status code is set by the controller.
-->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
<title th:text="#{site.form.error.title} + ' – ' + ${business.brandName}">Invio non riuscito – Logistica Sanchez</title>
<meta name="robots" content="noindex">
<th:block th:replace="~{layout/public :: htmlHead(false)}"></th:block>
</head>
<body data-page="form-error">
<th:block th:replace="~{layout/public :: siteHeader(null)}"></th:block>
<main id="main">
  <section class="section">
    <div class="container container-narrow prose">
      <h1 th:text="#{site.form.error.title}">Invio non riuscito</h1>
      <p th:text="${message}">Alcuni campi non sono compilati correttamente.</p>
      <p>
        <th:block th:text="#{site.form.error.alternatives.before}">Puoi anche scriverci a</th:block>
        <a th:href="|mailto:${business.officeEmail}|" th:text="${business.officeEmail}">ufficio</a>,
        <th:block th:text="#{site.form.error.alternatives.whatsapp}">su</th:block>
        <a th:href="${business.whatsappUrl()}" target="_blank" rel="noopener">WhatsApp</a>
        <th:block th:text="#{site.form.error.alternatives.phone}">o chiamarci al</th:block>
        <a th:href="|tel:${business.phoneDigits()}|" th:text="${business.phone}">telefono</a>.
      </p>
      <p><a class="btn btn-primary" th:href="${back}" th:text="#{site.form.error.back}">Torna al modulo</a></p>
    </div>
  </section>
</main>
<th:block th:replace="~{layout/public :: siteFooter}"></th:block>
</body>
</html>
