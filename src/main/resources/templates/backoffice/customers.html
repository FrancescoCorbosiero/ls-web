<!DOCTYPE html>
<!-- «Registrati» (ADM-03; chapter 04 §3.3: the same columns, newest first; search and pagination added, ADR 0017). -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{backoffice.customers.title} + ' · ' + #{layout.private.backoffice}">Registrati · Gestione</title>
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body th:attr="hx-headers=${hxHeaders}">
<th:block th:replace="~{layout/private :: siteHeader('staff', ${staff.displayName}, '/gestione/logout')}"></th:block>
<main id="main" class="section">
  <div class="container">
    <th:block th:replace="~{backoffice/layout :: nav('customers')}"></th:block>
    <h1 th:text="#{backoffice.customers.title}">Clienti registrati</h1>
    <th:block th:replace="~{backoffice/layout :: flash}"></th:block>
    <form method="get" th:action="@{/gestione/clienti/}" class="input-group mb-m" role="search">
      <label class="visually-hidden" for="q" th:text="#{backoffice.customers.search}">Cerca</label>
      <input class="input" id="q" name="q" type="search" maxlength="100" th:value="${q}" th:placeholder="#{backoffice.customers.searchHint}">
      <button type="submit" class="btn btn-secondary" th:text="#{backoffice.search}">Cerca</button>
    </form>
    <th:block th:replace="~{backoffice/layout :: pageInfo(${page})}"></th:block>
    <p class="muted" th:if="${page.totalElements == 0 and q.isEmpty()}" th:text="#{backoffice.customers.empty}">Nessun utente registrato</p>
    <div class="table-wrap" th:if="${page.totalElements > 0}">
      <table class="table" data-table="customers">
        <thead><tr>
          <th scope="col" th:text="#{backoffice.customers.col.id}">ID</th>
          <th scope="col" th:text="#{backoffice.customers.col.companyName}">Ragione sociale</th>
          <th scope="col" th:text="#{backoffice.customers.col.email}">Email</th>
          <th scope="col" th:text="#{backoffice.customers.col.address}">Indirizzo</th>
          <th scope="col" th:text="#{backoffice.customers.col.province}">Provincia</th>
          <th scope="col" th:text="#{backoffice.customers.col.city}">Città</th>
          <th scope="col" th:text="#{backoffice.customers.col.postalCode}">Cap</th>
          <th scope="col" th:text="#{backoffice.customers.col.phone}">Telefono</th>
          <th scope="col" th:text="#{backoffice.customers.col.emailVerified}">Email confermata</th>
          <th scope="col" th:text="#{backoffice.customers.col.status}">Stato</th>
          <th scope="col" th:text="#{backoffice.customers.col.registeredAt}">Registrato il</th>
        </tr></thead>
        <tbody>
          <tr th:each="c : ${page.content}" th:attr="data-customer=${c.id}">
            <td th:text="${c.id}">1</td>
            <td><a th:href="@{/gestione/clienti/{id}/(id=${c.id})}" th:text="${c.companyName}">Ditta</a></td>
            <td th:text="${c.email}">email</td>
            <td th:text="${c.addressLine}">via</td>
            <td th:text="${c.province}">MB</td>
            <td th:text="${c.city}">Seregno</td>
            <td th:text="${c.postalCode}">20831</td>
            <td th:text="${c.phone}">tel</td>
            <td th:text="${c.emailVerified()} ? #{backoffice.yes} : #{backoffice.no}">SI</td>
            <td><span class="badge" th:text="#{'customers.status.' + ${c.status.name()}}">Attivo</span></td>
            <td th:text="${fmt.date(c.registeredAt)}">01/01/2026</td>
          </tr>
        </tbody>
      </table>
    </div>
    <nav class="actions" th:if="${page.totalPages > 1}" th:aria-label="#{backoffice.pager.label}">
      <a class="btn btn-secondary btn-sm" th:if="${page.hasPrevious()}" th:href="@{/gestione/clienti/(q=${q}, pagina=${page.number})}" th:text="#{backoffice.pager.previous}">Precedente</a>
      <a class="btn btn-secondary btn-sm" th:if="${page.hasNext()}" th:href="@{/gestione/clienti/(q=${q}, pagina=${page.number + 2})}" th:text="#{backoffice.pager.next}">Successiva</a>
    </nav>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
