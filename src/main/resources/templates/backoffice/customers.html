<!DOCTYPE html>
<!-- «Registrati» (ADM-03; chapter 04 §3.3: the same columns, newest first; search and pagination added, ADR 0017; «Nuovo cliente», ADM-12; rows as cards on a phone, ADR 0029). -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{backoffice.customers.title} + ' · ' + #{layout.private.backoffice}">Registrati · Gestione</title>
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body th:attr="hx-headers=${hxHeaders}">
<th:block th:replace="~{layout/private :: siteHeader('staff', ${staff.displayName}, '/gestione/logout')}"></th:block>
<th:block th:replace="~{backoffice/layout :: nav('customers')}"></th:block>
<main id="main" class="app-main">
  <div class="container">
    <div class="page-head">
      <div>
        <h1 th:text="#{backoffice.customers.title}">Clienti registrati</h1>
        <p class="lede" th:text="#{backoffice.customers.lead}">Tutti i clienti, i più recenti in alto.</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-light" th:if="${exportEnabled}" data-export th:title="#{backoffice.export.hint}" th:href="@{/gestione/clienti/esporta(q=${q})}"><svg class="icon" aria-hidden="true"><use href="/img/app-icons.svg#i-file-text"/></svg><span th:text="#{backoffice.export.csv}">Esporta CSV</span></a>
        <a class="btn" href="/gestione/clienti/nuovo"><svg class="icon" aria-hidden="true"><use href="/img/app-icons.svg#i-user-plus"/></svg><span th:text="#{backoffice.customers.new}">Nuovo cliente</span></a>
      </div>
    </div>
    <th:block th:replace="~{backoffice/layout :: flash}"></th:block>
    <form method="get" th:action="@{/gestione/clienti/}" class="search-bar" role="search">
      <label class="visually-hidden" for="q" th:text="#{backoffice.customers.search}">Cerca</label>
      <input class="input" id="q" name="q" type="search" maxlength="100" th:value="${q}" th:placeholder="#{backoffice.customers.searchHint}">
      <button type="submit" class="btn btn-light"><svg class="icon" aria-hidden="true"><use href="/img/app-icons.svg#i-search"/></svg><span th:text="#{backoffice.search}">Cerca</span></button>
    </form>
    <th:block th:replace="~{backoffice/layout :: pageInfo(${page})}"></th:block>
    <p class="muted" th:if="${page.totalElements == 0 and !q.isEmpty()}" th:text="#{backoffice.list.none}">Nessun risultato.</p>
    <div class="empty" th:if="${page.totalElements == 0 and q.isEmpty()}" data-empty>
      <svg class="icon" aria-hidden="true"><use href="/img/app-icons.svg#i-users"/></svg>
      <h2 th:text="#{backoffice.customers.empty}">Nessun utente registrato</h2>
    </div>
    <div class="data-table-wrap" th:if="${page.totalElements > 0}">
      <table class="data-table stacked" data-table="customers">
        <thead><tr>
          <th scope="col" th:text="#{backoffice.customers.col.id}">ID</th>
          <th scope="col" th:text="#{backoffice.customers.col.companyName}">Ragione sociale</th>
          <th scope="col" th:text="#{backoffice.customers.col.email}">Email</th>
          <th scope="col" th:text="#{backoffice.customers.col.address}">Indirizzo</th>
          <th scope="col" th:text="#{backoffice.customers.col.province}">Provincia</th>
          <th scope="col" th:text="#{backoffice.customers.col.city}">Città</th>
          <th scope="col" th:text="#{backoffice.customers.col.postalCode}">Cap</th>
          <th scope="col" th:text="#{backoffice.customers.col.phone}">Telefono</th>
          <th scope="col" th:text="#{backoffice.customers.col.emailVerified}">Email confermata</th>
          <th scope="col" th:text="#{backoffice.customers.col.status}">Stato</th>
          <th scope="col" th:text="#{backoffice.customers.col.registeredAt}">Registrato il</th>
        </tr></thead>
        <tbody>
          <tr th:each="c : ${page.content}" th:attr="data-customer=${c.id}">
            <td class="muted" th:attr="data-label=#{backoffice.customers.col.id}" th:text="${c.id}">1</td>
            <td class="strong" th:attr="data-label=#{backoffice.customers.col.companyName}"><a th:href="@{/gestione/clienti/{id}/(id=${c.id})}" th:text="${c.companyName}">Ditta</a></td>
            <td th:attr="data-label=#{backoffice.customers.col.email}" th:text="${c.email}">email</td>
            <td th:attr="data-label=#{backoffice.customers.col.address}" th:text="${c.addressLine}">via</td>
            <td th:attr="data-label=#{backoffice.customers.col.province}" th:text="${c.province}">MB</td>
            <td th:attr="data-label=#{backoffice.customers.col.city}" th:text="${c.city}">Seregno</td>
            <td th:attr="data-label=#{backoffice.customers.col.postalCode}" th:text="${c.postalCode}">20831</td>
            <td th:attr="data-label=#{backoffice.customers.col.phone}" th:text="${c.phone}">tel</td>
            <td th:attr="data-label=#{backoffice.customers.col.emailVerified}" th:text="${c.emailVerified()} ? #{backoffice.yes} : #{backoffice.no}">SI</td>
            <td th:attr="data-label=#{backoffice.customers.col.status}"><span th:replace="~{layout/private :: customerStatus(${c.status})}">Attivo</span></td>
            <td th:attr="data-label=#{backoffice.customers.col.registeredAt}" th:text="${fmt.when(c.registeredAt)}" th:title="${fmt.dateTime(c.registeredAt)}">01/01/2026</td>
          </tr>
        </tbody>
      </table>
    </div>
    <th:block th:replace="~{backoffice/layout :: pager(${page}, @{/gestione/clienti/(q=${q}, pagina=${page.number})}, @{/gestione/clienti/(q=${q}, pagina=${page.number + 2})})}"></th:block>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
