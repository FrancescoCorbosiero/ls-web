<!DOCTYPE html>
<!-- Named confirmation of approve/decline (ADM-02; chapter 04 §7.2 «Sei sicuro di voler procedere?», «Conferma»/«Annulla»; fixes CMS-19; ADR 0029 layout). -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="(${action == 'approve'} ? #{backoffice.customers.approve} : #{backoffice.customers.decline}) + ' · ' + #{layout.private.backoffice}">Conferma · Gestione</title>
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body th:attr="hx-headers=${hxHeaders}">
<th:block th:replace="~{layout/private :: siteHeader('staff', ${staff.displayName}, '/gestione/logout')}"></th:block>
<th:block th:replace="~{backoffice/layout :: nav('customersPending')}"></th:block>
<main id="main" class="app-main">
  <div class="container container-narrow">
    <div class="page-head">
      <div>
        <a class="back-link" th:href="@{/gestione/clienti/{id}/(id=${customer.id})}"><svg class="icon" aria-hidden="true"><use href="/img/app-icons.svg#i-arrow-left"/></svg><span th:text="#{backoffice.customer.backToCustomer}">Torna al cliente</span></a>
        <h1 th:text="${action == 'approve'} ? #{backoffice.customers.approveTitle(${customer.companyName})} : #{backoffice.customers.declineTitle(${customer.companyName})}">Approva il cliente</h1>
      </div>
    </div>
    <th:block th:replace="~{backoffice/layout :: error(${error})}"></th:block>
    <section class="panel" th:classappend="${action == 'decline'} ? 'panel-danger'">
      <dl class="facts mb-m">
        <div class="span-all"><dt th:text="#{customers.field.email}">Email</dt><dd th:text="${customer.email}">-</dd></div>
        <div class="span-all"><dt th:text="#{orders.field.address}">Indirizzo</dt><dd th:text="${customer.addressOneLine()}">-</dd></div>
        <div><dt th:text="#{customers.field.phone}">Telefono</dt><dd th:text="${customer.phone}">-</dd></div>
        <div><dt th:text="#{backoffice.customers.col.emailVerified}">Email confermata</dt><dd th:text="${customer.emailVerified()} ? #{backoffice.yes} : #{backoffice.no}">SI</dd></div>
        <div><dt th:text="#{backoffice.customers.col.status}">Stato</dt><dd><span th:replace="~{layout/private :: customerStatus(${customer.status})}">-</span></dd></div>
      </dl>
      <div class="callout callout-info" th:if="${action == 'approve'}">
        <svg class="icon" aria-hidden="true"><use href="/img/app-icons.svg#i-info"/></svg>
        <p th:text="#{backoffice.customers.approveHint}">Il cliente riceve un'e-mail di conferma e può inserire ordini.</p>
      </div>
      <form method="post" th:action="${action == 'approve'} ? @{/gestione/clienti/{id}/approva(id=${customer.id})} : @{/gestione/clienti/{id}/rifiuta(id=${customer.id})}" class="fields">
        <div class="field span-all" th:if="${action == 'decline'}">
          <label class="label" for="motivo" th:text="#{backoffice.declineReason}">Motivo (facoltativo, inviato al cliente)</label>
          <textarea class="textarea" id="motivo" name="motivo" rows="3" maxlength="500"></textarea>
        </div>
        <p class="strong ink span-all mb-0" th:text="#{backoffice.confirm.question}">Sei sicuro di voler procedere?</p>
        <p class="form-actions span-all">
          <button type="submit" class="btn" th:classappend="${action == 'decline'} ? 'btn-danger-solid'" th:text="#{backoffice.confirm.yes}">Conferma</button>
          <a class="btn btn-light" href="/gestione/clienti/in-approvazione/" th:text="#{backoffice.confirm.no}">Annulla</a>
        </p>
      </form>
    </section>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
