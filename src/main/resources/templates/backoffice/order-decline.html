<!DOCTYPE html>
<!-- Decline an order (ADM-04; chapter 04 §4.5): named confirmation, optional reason sent in EML-05; on the version of the order shown (ADR 0028). -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{backoffice.orders.decline} + ' · ' + #{layout.private.backoffice}">Rifiuta ordine · Gestione</title>
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body th:attr="hx-headers=${hxHeaders}">
<th:block th:replace="~{layout/private :: siteHeader('staff', ${staff.displayName}, '/gestione/logout')}"></th:block>
<th:block th:replace="~{backoffice/layout :: nav('ordersPending')}"></th:block>
<main id="main" class="app-main">
  <div class="container container-narrow">
    <div class="page-head">
      <div>
        <a class="back-link" th:href="@{/gestione/ordini/{id}/(id=${order.id})}"><svg class="icon" aria-hidden="true"><use href="/img/app-icons.svg#i-arrow-left"/></svg><span th:text="#{backoffice.order.backToOrder}">Torna all'ordine</span></a>
        <h1 th:text="#{backoffice.orderDecline.title(${order.tempCode})}">Rifiuta l'ordine</h1>
        <p class="lede" th:text="#{backoffice.orderApprove.lead(${order.tempCode}, ${order.sender.name}, ${order.recipient.name}, ${order.recipient.city})}">Ordine provvisorio</p>
      </div>
    </div>
    <th:block th:replace="~{backoffice/layout :: error(${error})}"></th:block>
    <section class="panel panel-danger">
      <form method="post" th:action="@{/gestione/ordini/{id}/rifiuta(id=${order.id})}" class="fields">
        <input type="hidden" name="versione" th:value="${order.version}">
        <div class="field span-all">
          <label class="label" for="motivo" th:text="#{backoffice.declineReason}">Motivo (facoltativo, inviato al cliente)</label>
          <textarea class="textarea" id="motivo" name="motivo" rows="3" maxlength="500" th:text="${reason}"></textarea>
        </div>
        <p class="strong ink span-all mb-0" th:text="#{backoffice.confirm.question}">Sei sicuro di voler procedere?</p>
        <p class="form-actions span-all">
          <button type="submit" class="btn btn-danger-solid" th:text="#{backoffice.confirm.yes}">Conferma</button>
          <a class="btn btn-light" href="/gestione/ordini/in-approvazione/" th:text="#{backoffice.confirm.no}">Annulla</a>
        </p>
      </form>
    </section>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
