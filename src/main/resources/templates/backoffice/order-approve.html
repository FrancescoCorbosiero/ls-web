<!DOCTYPE html>
<!-- «Approva ordine» (ADM-04; chapter 04 §4.4: «Codice» and «Importo Totale (per cliente)», both required; ADR 0007). -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{backoffice.orders.approve} + ' · ' + #{layout.private.backoffice}">Approva ordine · Gestione</title>
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body th:attr="hx-headers=${hxHeaders}">
<th:block th:replace="~{layout/private :: siteHeader('staff', ${staff.displayName}, '/gestione/logout')}"></th:block>
<main id="main" class="section">
  <div class="container-narrow">
    <th:block th:replace="~{backoffice/layout :: nav('ordersPending')}"></th:block>
    <h1 th:text="#{backoffice.orders.approve}">Approva ordine</h1>
    <p class="muted" th:text="#{backoffice.orderApprove.lead(${order.tempCode}, ${order.sender.name}, ${order.recipient.name}, ${order.recipient.city})}">Ordine provvisorio</p>
    <th:block th:replace="~{backoffice/layout :: error(${error})}"></th:block>
    <form method="post" th:action="@{/gestione/ordini/{id}/approva(id=${order.id})}" class="form-grid">
      <div class="field">
        <label class="label" for="codice" th:text="#{backoffice.orderApprove.code}">Codice</label>
        <input class="input" id="codice" name="codice" type="text" maxlength="64" required autocomplete="off" th:value="${values['codice']}">
        <p class="field-hint" th:text="#{backoffice.orderApprove.codeHint}">Il codice definitivo della spedizione, unico.</p>
      </div>
      <div class="field">
        <label class="label" for="importo" th:text="#{backoffice.orderApprove.amount}">Importo Totale (per cliente)</label>
        <input class="input" id="importo" name="importo" type="text" inputmode="decimal" maxlength="20" required autocomplete="off" th:value="${values['importo']}">
        <p class="field-hint" th:text="#{backoffice.orderApprove.amountHint}">In euro, con la virgola: per esempio 180,50.</p>
      </div>
      <p class="actions">
        <button type="submit" class="btn btn-primary" th:text="#{backoffice.confirm.yes}">Conferma</button>
        <a class="btn btn-secondary" href="/gestione/ordini/in-approvazione/" th:text="#{backoffice.confirm.no}">Annulla</a>
      </p>
    </form>
    <p><a th:href="@{/gestione/ordini/{id}/(id=${order.id})}" th:text="#{backoffice.orders.detail}">Dettaglio</a></p>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
