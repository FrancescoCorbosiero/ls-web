<!DOCTYPE html>
<!-- A used, expired or unknown link (CUS-01): «Il link non è più valido» with the request form. -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title th:text="#{auth.customer.linkInvalid.title} + ' · ' + ${business.brandName}">Il link non è più valido · Logistica Sanchez</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<main id="main">
  <section class="container">
    <h1 th:text="#{auth.customer.linkInvalid.title}">Il link non è più valido</h1>
    <p th:text="#{auth.customer.linkInvalid.lead}">Inserisci di nuovo la tua e-mail per riceverne uno nuovo.</p>
    <form method="post" th:action="@{/area-clienti/}">
      <p>
        <label for="email" th:text="#{auth.customer.request.email}">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>
      </p>
      <p><button type="submit" class="btn" th:text="#{auth.customer.request.submit}">Avanti</button></p>
    </form>
  </section>
</main>
</body>
</html>
