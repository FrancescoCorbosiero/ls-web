<!DOCTYPE html>
<!-- One-time set-password page of a staff account (ADM-01): the GET renders, the POST consumes the link. -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{auth.staff.setPassword.title} + ' · ' + ${business.brandName}">Imposta la password · Logistica Sanchez</title>
  <meta name="referrer" content="no-referrer">
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/private :: siteHeader('staff', null, null)}"></th:block>
<main id="main" class="section">
  <div class="container-narrow">
    <h1 th:text="#{auth.staff.setPassword.title}">Imposta la password</h1>
    <p class="lede" th:text="#{auth.staff.setPassword.lead(${username})}">Scegli la password del tuo account.</p>
    <p class="callout field-error" role="alert" th:if="${errorKey != null}" th:text="${#messages.msg(errorKey)}">Errore</p>
    <form method="post" th:action="@{/gestione/imposta-password}" class="form-grid">
      <input type="hidden" name="t" th:value="${token}">
      <div class="field">
        <label class="label" for="password" th:text="#{auth.staff.setPassword.password}">Nuova password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="12" required autofocus>
      </div>
      <div class="field">
        <label class="label" for="passwordConfirm" th:text="#{auth.staff.setPassword.confirm}">Ripeti la password</label>
        <input class="input" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <div class="actions"><button type="submit" class="btn btn-primary" th:text="#{auth.staff.setPassword.submit}">Salva la password</button></div>
    </form>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
