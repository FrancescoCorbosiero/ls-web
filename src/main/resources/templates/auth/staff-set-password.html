<!DOCTYPE html>
<!-- One-time set-password page of a staff account (ADM-01): the GET renders, the POST consumes the link. -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title th:text="#{auth.staff.setPassword.title} + ' · ' + ${business.brandName}">Imposta la password · Logistica Sanchez</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<main id="main">
  <section class="container">
    <h1 th:text="#{auth.staff.setPassword.title}">Imposta la password</h1>
    <p th:text="#{auth.staff.setPassword.lead(${username})}">Scegli la password del tuo account.</p>
    <p class="error" role="alert" th:if="${errorKey != null}" th:text="${#messages.msg(errorKey)}">Errore</p>
    <form method="post" th:action="@{/gestione/imposta-password}">
      <input type="hidden" name="t" th:value="${token}">
      <p>
        <label for="password" th:text="#{auth.staff.setPassword.password}">Nuova password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required autofocus>
      </p>
      <p>
        <label for="passwordConfirm" th:text="#{auth.staff.setPassword.confirm}">Ripeti la password</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" required>
      </p>
      <p><button type="submit" class="btn" th:text="#{auth.staff.setPassword.submit}">Salva la password</button></p>
    </form>
  </section>
</main>
</body>
</html>
