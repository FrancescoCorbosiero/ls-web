<!DOCTYPE html>
<!-- A used, expired or unknown set-password link (ADM-01). -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{auth.staff.linkInvalid.title} + ' · ' + ${business.brandName}">Il link non è più valido · Logistica Sanchez</title>
  <meta name="referrer" content="no-referrer">
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/private :: siteHeader('staff', null, null)}"></th:block>
<main id="main" class="app-main">
  <div class="container container-narrow">
    <div class="page-head">
      <div>
        <h1 th:text="#{auth.staff.linkInvalid.title}">Il link non è più valido</h1>
      </div>
    </div>
    <p class="lede" th:text="#{auth.staff.linkInvalid.lead}">Chiedi a un amministratore un nuovo link.</p>
    <p><a class="btn" th:href="@{/gestione/}" th:text="#{auth.staff.login.title}">Login</a></p>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
