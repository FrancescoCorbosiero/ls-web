<!DOCTYPE html>
<!--
  Customer sign-in: the e-mail form (CUS-01). Copy of the legacy portal's e-mail check screen
  (chapter 03 §5.1/§8) adapted: «Inserisci la tua e-mail», hint without its second sentence.
  After the POST the same page shows «Ti abbiamo inviato un'email…» for every address.
-->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="#{auth.customer.request.title} + ' · ' + ${business.brandName}">Area clienti · Logistica Sanchez</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<main id="main">
  <section class="container">
    <h1 th:text="#{auth.customer.request.heading}">Inserisci la tua e-mail</h1>
    <p class="notice" role="status" th:if="${sent}" th:text="#{auth.customer.request.sent}">Ti abbiamo inviato un'email: segui il link per continuare</p>
    <form method="post" th:action="@{/area-clienti/}">
      <p>
        <label for="email" th:text="#{auth.customer.request.email}">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required autofocus>
      </p>
      <p class="muted" th:text="#{auth.customer.request.hint}">Assicurati di aver inserito la mail corretta.</p>
      <p><button type="submit" class="btn" th:text="#{auth.customer.request.submit}">Avanti</button></p>
    </form>
    <p class="muted"><a th:href="@{/privacy/}" th:text="#{auth.customer.request.privacy}">Informativa privacy</a></p>
  </section>
</main>
</body>
</html>
