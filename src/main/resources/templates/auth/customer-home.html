<!DOCTYPE html>
<!-- Phase 1 stub home of the customer area; the orders module (Phase 2) replaces it. -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{auth.customer.home.title} + ' · ' + ${business.brandName}">I tuoi ordini · Logistica Sanchez</title>
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body th:attr="hx-headers=${hxHeaders}">
<th:block th:replace="~{layout/private :: siteHeader('customer', ${email}, '/area-clienti/logout')}"></th:block>
<main id="main" class="section">
  <div class="container-narrow">
    <h1 th:text="#{auth.customer.home.title}">I tuoi ordini</h1>
    <p class="muted" th:text="#{auth.customer.home.signedInAs(${email})}">Hai effettuato l'accesso</p>
    <p class="lede" th:text="#{auth.customer.home.lead}">L'area clienti è in arrivo.</p>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
