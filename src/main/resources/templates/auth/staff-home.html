<!DOCTYPE html>
<!-- Phase 1 stub home of the back office; the backoffice module (Phase 2) replaces it. -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{auth.staff.home.title} + ' · ' + ${business.brandName}">Gestione · Logistica Sanchez</title>
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body th:attr="hx-headers=${hxHeaders}">
<th:block th:replace="~{layout/private :: siteHeader('staff', ${displayName}, '/gestione/logout')}"></th:block>
<main id="main" class="section">
  <div class="container-narrow">
    <h1 th:text="#{auth.staff.home.title}">Gestione</h1>
    <p class="muted" th:text="#{auth.staff.home.welcome(${displayName})}">Ciao</p>
    <p class="lede" th:text="#{auth.staff.home.lead}">L'area di gestione è in arrivo.</p>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
