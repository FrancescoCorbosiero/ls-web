<!DOCTYPE html>
<!--
  The e-mailed link lands here (CUS-01, chapter 10 §2): one «Accedi» button in a CSRF-protected
  form that works without JavaScript. The GET never consumes the token; this form's POST does.
-->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title th:text="#{auth.customer.link.title} + ' · ' + ${business.brandName}">Accedi all'area clienti · Logistica Sanchez</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<main id="main">
  <section class="container">
    <h1 th:text="#{auth.customer.link.title}">Accedi all'area clienti</h1>
    <p th:text="#{auth.customer.link.lead}">Premi il pulsante per entrare nella tua area clienti.</p>
    <form method="post" th:action="@{/area-clienti/accesso}">
      <input type="hidden" name="t" th:value="${token}">
      <p><button type="submit" class="btn" th:text="#{auth.customer.link.submit}">Accedi</button></p>
    </form>
  </section>
</main>
</body>
</html>
