<!DOCTYPE html>
<!-- The CHANGE_EMAIL link lands here (CUS-06): one button in a CSRF-protected form; the GET never consumes the token. -->
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="#{auth.customer.changeEmail.title} + ' · ' + ${business.brandName}">Conferma la nuova e-mail · Logistica Sanchez</title>
  <meta name="referrer" content="no-referrer">
  <th:block th:replace="~{layout/private :: htmlHead}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/private :: siteHeader('customer', null, null)}"></th:block>
<main id="main" class="section">
  <div class="container-narrow">
    <h1 th:text="#{auth.customer.changeEmail.title}">Conferma la nuova e-mail</h1>
    <p class="lede" th:text="#{auth.customer.changeEmail.lead(${newEmail})}">Premi il pulsante per usare questo indirizzo come e-mail di accesso.</p>
    <form method="post" th:action="@{/area-clienti/cambio-email}">
      <input type="hidden" name="t" th:value="${token}">
      <div class="actions"><button type="submit" class="btn btn-primary btn-lg" th:text="#{auth.customer.changeEmail.submit}">Conferma</button></div>
    </form>
  </div>
</main>
<th:block th:replace="~{layout/private :: siteFooter}"></th:block>
</body>
</html>
