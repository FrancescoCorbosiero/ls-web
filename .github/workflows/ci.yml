name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"
      - "module/*"
      - m2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same major as local, staging and production (ADR 0001). Test-only credentials.
        image: postgres:16
        env:
          POSTGRES_DB: ls_web_test
          POSTGRES_USER: ls
          POSTGRES_PASSWORD: ls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ls -d ls_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ls_web_test
      TEST_DATABASE_USER: ls
      TEST_DATABASE_PASSWORD: ls
      TZ: Europe/Rome
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build, format check, unit and integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (full history for the secret scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tracked files that must never be committed
        run: tools/ci/guard-tracked-files.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
