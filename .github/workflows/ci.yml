name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"
      - "module/*"
      - m2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same major as local, staging and production (ADR 0001). Test-only credentials.
        image: postgres:16
        env:
          POSTGRES_DB: ls_web_test
          POSTGRES_USER: ls
          POSTGRES_PASSWORD: ls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ls -d ls_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ls_web_test
      TEST_DATABASE_USER: ls
      TEST_DATABASE_PASSWORD: ls
      TZ: Europe/Rome
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build, format check, unit and integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ls_web_e2e
          POSTGRES_USER: ls
          POSTGRES_PASSWORD: ls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ls -d ls_web_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Europe/Rome
      # e2e/run.sh: an empty database provided by the service instead of the local instance.
      E2E_DATABASE_URL: jdbc:postgresql://localhost:5432/ls_web_e2e
      E2E_DATABASE_USER: ls
      E2E_DATABASE_PASSWORD: ls
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Package the jar (tests run in build-and-test)
        run: ./mvnw -B -ntp -DskipTests package

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the Playwright tooling
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Install Chromium (CI only; locally the browsers are preinstalled)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start the app on a fresh database and run the suite
        run: e2e/run.sh

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            .local/e2e/
          if-no-files-found: ignore
          retention-days: 14

  guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (full history for the secret scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tracked files that must never be committed
        run: tools/ci/guard-tracked-files.sh

      - name: Compose file is valid
        working-directory: deploy
        # compose.yml reads deploy/.env (env_file): the example stands in for it, the required
        # values come from the environment below
        run: cp .env.example .env && docker compose -f compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
          LS_SECURITY_IP_HASH_KEY: ci-only
          LS_TOKEN_ENCRYPTION_KEY: ci-only

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  image:
    name: Container image
    needs: [build-and-test, e2e, guards]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/francescocorbosiero/ls-web
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (pushes only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main and phase-* branches)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
