# Local development with Docker (alternative to the PostgreSQL binaries of scripts/local-db.sh).
#
#   docker compose -f deploy/compose.dev.yml up -d db          # PostgreSQL 16 on localhost:54329
#                                                              # (role ls/ls, databases ls_web, ls_web_test, ls_web_e2e)
#   scripts/dev.sh                                             # uses it automatically when initdb is missing
#
#   docker compose -f deploy/compose.dev.yml --profile app up --build   # database + the app image on :8080
#   docker compose -f deploy/compose.dev.yml run --rm app dev-seed      # synthetic data (passwords printed once)
#
# Same port and credentials as scripts/local-db.sh, so tests, e2e/run.sh and dev.sh work unchanged.
# Everything here is local only: no secret, no real data. Never use this file on a server.
name: ls-web-dev

services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: ls
      POSTGRES_PASSWORD: ls
      POSTGRES_DB: ls_web
    volumes:
      - ./dev/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ls -d ls_web"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/ls_web
      DATABASE_USER: ls
      DATABASE_PASSWORD: ls
      LS_NOTIFICATIONS_DIRECTORY_PATH: /app/mail
    volumes:
      - ../.local/mail:/app/mail
    depends_on:
      db:
        condition: service_healthy

volumes:
  dev_pgdata:
